name: Publicar desafio do dia

on:
  schedule:
    - cron: "47 21 * * *"   # 18:47 em Brasilia, todo dia
    - cron: "23 23 * * *"   # 20:23 em Brasilia: reserva, so publica se o das 18:47 nao rodou
  push:
    paths:
      - "diagnostico/publicar_agora.txt"   # permite disparar por commit
  workflow_dispatch:
    inputs:
      forcar:
        description: "Publicar mesmo se ja houve post nas ultimas 18h"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar configuracao
        id: cfg
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
        run: |
          if [ -z "$IG_TOKEN" ]; then echo "::notice::Segredo IG_TOKEN ainda nao configurado - nada a fazer"; echo "ok=false" >> $GITHUB_OUTPUT; else echo "ok=true" >> $GITHUB_OUTPUT; fi

      - uses: actions/checkout@v5
        if: steps.cfg.outputs.ok == 'true'

      - uses: actions/setup-python@v6
        if: steps.cfg.outputs.ok == 'true'
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        if: steps.cfg.outputs.ok == 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q -r requirements.txt

      - name: Gerar o proximo desafio (se a fila estiver vazia)
        if: steps.cfg.outputs.ok == 'true'
        run: python publicar.py preparar

      - name: Salvar o desafio no repositorio
        if: steps.cfg.outputs.ok == 'true'
        run: |
          git config user.name "quebra-cuca-bot"
          git config user.email "quebra-cuca-bot@users.noreply.github.com"
          git add docs estado.json
          git diff --cached --quiet || git commit -m "Gera proximo desafio"
          git push

      - name: Publicar no Instagram
        if: steps.cfg.outputs.ok == 'true'
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          EVENTO: ${{ github.event_name }}
          FORCAR: ${{ inputs.forcar }}
          MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL }}
        run: |
          # midias servidas pelo jsDelivr direto do repositorio publico, fixadas no commit atual
          if [ -z "$MEDIA_BASE_URL" ]; then export MEDIA_BASE_URL="https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@$(git rev-parse HEAD)/docs"; fi
          python publicar.py publicar

      - name: Atualizar estatisticas
        if: always() && steps.cfg.outputs.ok == 'true'
        continue-on-error: true
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
        run: python metricas.py

      - name: Salvar estado
        if: always() && steps.cfg.outputs.ok == 'true'
        run: |
          git add estado.json docs diagnostico
          git diff --cached --quiet || git commit -m "Publica desafio"
          git pull --rebase -q && git push
