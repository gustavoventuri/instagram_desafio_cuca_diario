name: Publicar desafio do dia

on:
  schedule:
    - cron: "47 21 * * *"   # 18:47 em Brasilia, todo dia
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Verificar configuracao
        id: cfg
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
        run: |
          if [ -z "$IG_TOKEN" ]; then echo "::notice::Segredo IG_TOKEN ainda nao configurado - nada a fazer"; echo "ok=false" >> $GITHUB_OUTPUT; else echo "ok=true" >> $GITHUB_OUTPUT; fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ok == 'true'

      - uses: actions/setup-python@v5
        if: steps.cfg.outputs.ok == 'true'
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        if: steps.cfg.outputs.ok == 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q -r requirements.txt

      - name: Gerar o proximo desafio (se a fila estiver vazia)
        if: steps.cfg.outputs.ok == 'true'
        run: python publicar.py preparar

      - name: Salvar o desafio no repositorio
        if: steps.cfg.outputs.ok == 'true'
        run: |
          git config user.name "quebra-cuca-bot"
          git config user.email "quebra-cuca-bot@users.noreply.github.com"
          git add docs estado.json
          git diff --cached --quiet || git commit -m "Gera proximo desafio"
          git push

      - name: Publicar a pasta docs no GitHub Pages
        if: steps.cfg.outputs.ok == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy do Pages
        if: steps.cfg.outputs.ok == 'true'
        uses: actions/deploy-pages@v4

      - name: Publicar no Instagram
        if: steps.cfg.outputs.ok == 'true'
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
        run: python publicar.py publicar

      - name: Salvar estado
        if: steps.cfg.outputs.ok == 'true'
        run: |
          git add estado.json
          git diff --cached --quiet || git commit -m "Publica desafio"
          git pull --rebase -q && git push
