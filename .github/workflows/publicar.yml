name: Publicar desafio do dia

on:
  schedule:
    - cron: "43 14 * * *"   # 11:43 em Brasilia: curiosidade
    - cron: "47 21 * * *"   # 18:47 em Brasilia: desafio
    - cron: "23 23 * * *"   # 20:23 em Brasilia: reserva, so publica se o das 18:47 nao rodou
  push:
    paths:
      - "diagnostico/publicar_agora.txt"              # desafio, disparado por commit
      - "diagnostico/publicar_curiosidade_agora.txt"  # curiosidade, disparada por commit
      - "diagnostico/publicar_short_agora.txt"        # Short do YouTube, disparado por commit
  workflow_dispatch:
    inputs:
      serie:
        description: "Qual serie publicar"
        type: choice
        options: [desafios, curiosidades, youtube]
        default: desafios
      forcar:
        description: "Publicar mesmo se ja houve post da serie nas ultimas 18h"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar configuracao
        id: cfg
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
        run: |
          if [ -z "$IG_TOKEN" ]; then echo "::notice::Segredo IG_TOKEN ainda nao configurado - nada a fazer"; echo "ok=false" >> $GITHUB_OUTPUT; else echo "ok=true" >> $GITHUB_OUTPUT; fi

      - uses: actions/checkout@v5
        if: steps.cfg.outputs.ok == 'true'
        with:
          fetch-depth: 2

      - name: Escolher a serie
        if: steps.cfg.outputs.ok == 'true'
        env:
          SERIE_INPUT: ${{ inputs.serie }}
          CRON: ${{ github.event.schedule }}
        run: |
          SERIE="$SERIE_INPUT"
          if [ -z "$SERIE" ] && [ "$CRON" = "43 14 * * *" ]; then SERIE=curiosidades; fi
          if [ -z "$SERIE" ] && [ "${{ github.event_name }}" = "push" ] && git diff --name-only HEAD~1 HEAD | grep -q publicar_curiosidade_agora; then SERIE=curiosidades; fi
          if [ -z "$SERIE" ] && [ "${{ github.event_name }}" = "push" ] && git diff --name-only HEAD~1 HEAD | grep -q publicar_short_agora; then SERIE=youtube; fi
          echo "SERIE=${SERIE:-desafios}" >> $GITHUB_ENV
          echo "serie: ${SERIE:-desafios}"

      - uses: actions/setup-python@v6
        if: steps.cfg.outputs.ok == 'true'
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        if: steps.cfg.outputs.ok == 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q -r requirements.txt

      - name: Conferir a fila (posts aprovados)
        if: steps.cfg.outputs.ok == 'true' && env.SERIE != 'youtube'
        env:
          AUTO_GERAR: ${{ vars.AUTO_GERAR }}
        run: python publicar.py preparar

      - name: Salvar o desafio no repositorio
        if: steps.cfg.outputs.ok == 'true'
        run: |
          git config user.name "quebra-cuca-bot"
          git config user.email "quebra-cuca-bot@users.noreply.github.com"
          git add docs estado.json
          git diff --cached --quiet || git commit -m "Gera proximo post"
          git push

      - name: Publicar no Instagram
        if: steps.cfg.outputs.ok == 'true'
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          EVENTO: ${{ github.event_name }}
          FORCAR: ${{ inputs.forcar }}
          MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACIDADE: ${{ vars.YT_PRIVACIDADE }}
        run: |
          # midias servidas pelo jsDelivr direto do repositorio publico, fixadas no commit atual
          if [ -z "$MEDIA_BASE_URL" ]; then export MEDIA_BASE_URL="https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@$(git rev-parse HEAD)/docs"; fi
          if [ "$SERIE" = "youtube" ]; then python youtube.py; else python publicar.py publicar; fi

      - name: Atualizar estatisticas
        if: always() && steps.cfg.outputs.ok == 'true'
        continue-on-error: true
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
        run: python metricas.py

      - name: Salvar estado
        if: always() && steps.cfg.outputs.ok == 'true'
        run: |
          git add estado.json docs diagnostico
          git diff --cached --quiet || git commit -m "Publica $SERIE"
          git pull --rebase -q && git push
