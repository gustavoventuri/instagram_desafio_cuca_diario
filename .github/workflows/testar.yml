name: Testar conexao com o Instagram

on:
  workflow_dispatch: {}
  push:
    paths:
      - "diagnostico/pedido.txt"

permissions:
  contents: write

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - name: Testar
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
        run: |
          mkdir -p diagnostico
          set +e
          python publicar.py testar > diagnostico/resultado.txt 2>&1
          echo "codigo_saida=$?" >> diagnostico/resultado.txt
          echo "tem_token=$([ -n "$IG_TOKEN" ] && echo sim || echo nao) tem_id=$([ -n "$IG_USER_ID" ] && echo sim || echo nao)" >> diagnostico/resultado.txt
          date -u >> diagnostico/resultado.txt
          cat diagnostico/resultado.txt
      - name: Salvar resultado no repositorio
        run: |
          git config user.name "quebra-cuca-bot"
          git config user.email "quebra-cuca-bot@users.noreply.github.com"
          git add diagnostico/resultado.txt
          git commit -m "Resultado do teste de conexao" && git push
